#:schema https://docs.jj-vcs.dev/latest/config-schema.json

# Jujutsu (jj) user config.
# Docs: https://docs.jj-vcs.dev/latest/config/
# Edit with `jj config edit --user`; show resolved values with `jj config list`.

[user]
name = "sdiehl"
email = "stephen.m.diehl@gmail.com"

[ui]
# Default to `jj log` when invoked with no subcommand.
default-command = "log"
# Built-in side-by-side diff editor; press `c` to confirm.
diff-editor = ":builtin"
# Use git-style unified diffs in `jj diff` / `jj show`.
diff-formatter = ":git"
# Pipe output through delta so diffs render like the git pager does.
pager = ["delta", "--pager", "less -FRX"]
paginate = "auto"

[ui.movement]
# `jj next` / `jj prev` create a new working-copy commit on top of the target
# instead of silently rewriting the current one. Safer when iterating.
edit = false

[git]
# Write the change-id into the git commit header so colocated repos preserve
# jj identity across `git` operations.
write-change-id-header = true
# Refuse to push commits whose description starts with `wip:` or `private:`.
private-commits = "description(glob:'wip:*') | description(glob:'private:*')"

[remotes.origin]
# Track only my own branches and trunk; leave coworkers' bookmarks untracked
# (and therefore immutable via the builtin immutable_heads()).
auto-track-bookmarks = "sdiehl/* | main | master"

[templates]
# `jj git push -c` names branches `sdiehl/<change-id>` instead of `push-<id>`.
git_push_bookmark = '"sdiehl/" ++ change_id.short()'

[revsets]
# `jj log` default: show work that diverges from main, plus a little context.
log = "present(@) | ancestors(immutable_heads().., 2) | present(trunk())"

[revset-aliases]
# Used by the `tug` alias: nearest bookmark at-or-before the given revision.
"closest_bookmark(x)" = "(bookmarks() & ::x).heads()"

[aliases]
l = ["log"]
s = ["status"]
d = ["diff"]
n = ["new"]
e = ["edit"]
ds = ["describe"]
nuke = ["abandon"]
tug = ["bookmark", "move", "--from", "closest_bookmark(@-)", "--to", "@-"]
# jj has no hooks; run pre-commit before `jj git push`.
pc = ["util", "exec", "--", "pre-commit", "run", "--all-files"]

[snapshot]
# Don't auto-snapshot huge artifacts into the working copy.
max-new-file-size = "32MiB"

[merge-tools.delta]
# Make `jj diff --tool delta` work cleanly.
diff-args = ["--color=always", "$left", "$right"]

# `jj fix` formatters (stdin to stdout), applied across every commit in a stack.
[fix.tools.stylua]
command = ["stylua", "--stdin-filepath=$path", "-"]
patterns = ["glob:'**/*.lua'"]

[fix.tools.taplo]
command = ["taplo", "fmt", "-"]
patterns = ["glob:'**/*.toml'"]

[fix.tools.shfmt]
command = ["shfmt", "-filename", "$path"]
patterns = ["glob:'**/*.sh'"]

[fix.tools.dprint]
command = ["dprint", "fmt", "--stdin", "$path"]
patterns = ["glob:'**/*.md'", "glob:'**/*.json'"]
